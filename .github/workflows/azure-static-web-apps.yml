name: Validate retail multi-agent demo
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix api --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Compile infrastructure
        run: az bicep build --file infra/main.bicep --outfile /tmp/retail-main.json
# Deliberately validation-only. Publishing is a separate, operator-run step.
